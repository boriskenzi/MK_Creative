# Refresh Picdrop galleries automatically, then let the Pages deploy
# workflow publish whenever this job pushes a change.
name: Sync Picdrop galleries

on:
  schedule:
    # Hourly is reliable on GitHub Actions. */5 is heavily delayed/throttled.
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porfolioBoris
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Sync galleries from Picdrop
        id: picdrop
        run: python scripts/import-picdrop.py --force

      - name: Commit gallery files
        working-directory: ${{ github.workspace }}
        run: |
          git add porfolioBoris/src/assets/galleries porfolioBoris/src/data/picdrop-sync.json
          if git diff --cached --quiet; then
            echo "No gallery changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Met a jour les galeries Picdrop."
          git pull --rebase origin main
          git push
